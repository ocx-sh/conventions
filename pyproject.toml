[project]
name = "ocx-conventions-selftest"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "copier==9.18.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders fixtures and runs task setup/verify (P6)"]
