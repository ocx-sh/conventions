# D-04 ocx tool map: tool name -> ocx.toml group, and tool name -> index repository.
# Read by scripts/pin-exact.py (groups) and baseline:check (repositories; C-012 http_archive check).
# A tool not listed under [groups] stays in the default [tools] table (pin-exact warns).

[groups]
task = "default"
prek = "lint"
gitleaks = "lint"
actionlint = "lint"
lychee = "lint"
shellcheck = "lint"
shfmt = "lint"
hawkeye = "lint"
buildifier = "lint"
grim = "lint"
uv = "lint"
ruff = "lint"
zizmor = "lint"
python = "test"
bazelisk = "build"
bazel = "build"
cmake = "build"
ninja = "build"
rust = "build"
go = "build"
node = "docs"
pnpm = "docs"
git-cliff = "release"

[repositories]
task = "ocx.sh/go-task/task"
prek = "ocx.sh/prek/prek"
gitleaks = "ocx.sh/gitleaks/gitleaks"
actionlint = "ocx.sh/actionlint/actionlint"
lychee = "ocx.sh/lychee/lychee"
shellcheck = "ocx.sh/shellcheck/shellcheck"
shfmt = "ocx.sh/shfmt/shfmt"
hawkeye = "ocx.sh/hawkeye/hawkeye"
buildifier = "ocx.sh/bazelbuild/buildifier"
grim = "ocx.sh/grimoire/cli"
uv = "ocx.sh/astral-sh/uv"
ruff = "ocx.sh/astral-sh/ruff"
zizmor = "ocx.sh/zizmorcore/zizmor"
python = "ocx.sh/astral-sh/python-build-standalone"
bazelisk = "ocx.sh/bazelbuild/bazelisk"
bazel = "ocx.sh/bazelbuild/bazel"
cmake = "ocx.sh/kitware/cmake"
ninja = "ocx.sh/ninja-build/ninja"
rust = "ocx.sh/rust-lang/rust"
go = "ocx.sh/golang/go"
node = "ocx.sh/nodejs/node"
pnpm = "ocx.sh/pnpm/pnpm"
git-cliff = "ocx.sh/git-cliff/git-cliff"
