# ocx-sh/conventions copier template. No _tasks, _migrations or
# _jinja_extensions on purpose: `--trust` must never be needed (Q5).
# Ownership of every rendered path lives in MANIFEST.toml.
_min_copier_version: "9.18.2"
_subdirectory: template
_answers_file: .copier-answers.yml

# Seeded once: written on first copy, never overwritten afterwards.
_skip_if_exists:
  - taskfile.yml
  - ocx.toml
  - grimoire.toml
  - AGENTS.md
  - .gitleaks.toml
  - .bazelrc
  - MODULE.bazel
  - .github/renovate-local.json
  - .github/workflows/basic-repo.yml
  - .github/workflows/deep-repo.yml

repo_name:
  type: str
  help: Repository name (without owner), e.g. ocx-website

repo_owner:
  type: str
  help: GitHub owner or org of the repository, e.g. ocx-sh
  default: ocx-sh

profile:
  type: str
  help: Baseline profile. `mirror` renders only the mirror subset (see MANIFEST.toml).
  choices:
    - full
    - mirror
  default: full

bazel:
  type: bool
  help: Does the repo build with Bazel (adds bazel/baseline.bazelrc, .bazelrc, MODULE.bazel, build job)?
  default: false
  when: "{{ profile == 'full' }}"

languages:
  type: str
  help: Languages present in the repo (lore bundle names)
  multiselect: true
  choices:
    - bazel
    - cmake
    - dotnet
    - go
    - jvm
    - nix
    - python
    - rust
    - shell
    - swift
    - typescript
  default: []
  when: "{{ profile == 'full' }}"
  # --data / --data-file input can bypass `choices`, so reject unknown entries here.
  validator: >-
    {%- set allowed = ['bazel', 'cmake', 'dotnet', 'go', 'jvm', 'nix', 'python', 'rust', 'shell', 'swift', 'typescript'] -%}
    {%- for l in languages if l not in allowed -%}
    Unknown language '{{ l }}'; allowed: {{ allowed | join(', ') }}.{{ ' ' }}
    {%- endfor -%}

site:
  type: yaml
  help: >-
    null, or a mapping {dir, dist, deploy (bool), path (optional str, may be empty), paths (optional list of str: extra deploy trigger globs)}
    describing the site build and Bunny deploy.
  default: null
  when: "{{ profile == 'full' }}"
  validator: >-
    {%- if site is not none -%}
    {%- if site is not mapping -%}
    site must be null or a mapping with keys dir, dist, deploy, path, paths.
    {%- else -%}
    {%- for k in ['dir', 'dist', 'deploy'] if k not in site -%}
    site.{{ k }} is required.{{ ' ' }}
    {%- endfor -%}
    {%- for k in site if k not in ['dir', 'dist', 'deploy', 'path', 'paths'] -%}
    Unknown site key '{{ k }}'; allowed: dir, dist, deploy, path, paths.{{ ' ' }}
    {%- endfor -%}
    {%- if 'deploy' in site and site.deploy is not boolean -%}
    site.deploy must be a boolean.{{ ' ' }}
    {%- endif -%}
    {%- for k in ['dir', 'dist', 'path'] if k in site and site[k] is not string -%}
    site.{{ k }} must be a string.{{ ' ' }}
    {%- endfor -%}
    {%- if 'paths' in site and (site.paths is string or site.paths is not iterable or site.paths is mapping) -%}
    site.paths must be a list of strings.{{ ' ' }}
    {%- else -%}
    {%- for p in site.get('paths', []) if p is not string -%}
    site.paths must be a list of strings.{{ ' ' }}
    {%- endfor -%}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

deep_os:
  type: str
  help: Runner OS matrix for the nightly verify-deep workflow
  multiselect: true
  choices:
    - ubuntu-latest
    - ubuntu-24.04-arm
    - macos-latest
    - macos-15-intel
    - macos-26
    - windows-latest
    - windows-11-arm
  default:
    - ubuntu-latest
  when: "{{ profile == 'full' }}"
  validator: >-
    {%- set allowed = ['ubuntu-latest', 'ubuntu-24.04-arm', 'macos-latest', 'macos-15-intel', 'macos-26', 'windows-latest', 'windows-11-arm'] -%}
    {%- if not deep_os -%}deep_os must list at least one OS.{{ ' ' }}{%- endif -%}
    {%- for o in deep_os if o not in allowed -%}
    Unknown deep_os '{{ o }}'; allowed: {{ allowed | join(', ') }}.{{ ' ' }}
    {%- endfor -%}

bazel_cache_write:
  type: str
  help: >-
    Who may write the Bazel remote cache. `main`: only a push to main, every other event reads. `trusted`: every job
    that runs a ci:* task presents the write credential on every event that carries it (a fork PR carries none).
  choices:
    - main
    - trusted
  default: main
  when: "{{ profile == 'full' and bazel }}"

repo_workflows:
  type: yaml
  help: >-
    false, or a mapping {secrets: [NAME, ...]}. The repo owns .github/workflows/basic-repo.yml and deep-repo.yml, which
    verify-basic and verify-deep call as their `repo` job; each listed secret is passed to them by name.
  default: false
  when: "{{ profile == 'full' }}"
  validator: >-
    {%- if repo_workflows is boolean -%}
    {%- if repo_workflows -%}repo_workflows must be false or a mapping {secrets: [NAME, ...]}.{%- endif -%}
    {%- elif repo_workflows is not mapping -%}
    repo_workflows must be false or a mapping {secrets: [NAME, ...]}.
    {%- else -%}
    {%- for k in repo_workflows if k != 'secrets' -%}
    Unknown repo_workflows key '{{ k }}'; allowed: secrets.{{ ' ' }}
    {%- endfor -%}
    {%- if 'secrets' not in repo_workflows -%}
    repo_workflows.secrets is required (use [] for none).
    {%- elif repo_workflows.secrets is string or repo_workflows.secrets is mapping or repo_workflows.secrets is not iterable -%}
    repo_workflows.secrets must be a list of secret names.
    {%- else -%}
    {%- for s in repo_workflows.secrets if s is not string or not (s | regex_search('^[A-Za-z_][A-Za-z0-9_]*$')) or s.upper().startswith('GITHUB_') -%}
    Invalid secret name '{{ s }}': letters, digits and underscores, not starting with a digit or GITHUB_.{{ ' ' }}
    {%- endfor -%}
    {%- endif -%}
    {%- endif -%}

zizmor_ignore:
  type: yaml
  help: >-
    List of workflow paths that another tool generates (e.g. .github/workflows/release.yml from cargo-dist) and zizmor must
    not report on. Hand-written workflows are fixed, not listed.
  default: []
  when: "{{ profile == 'full' }}"
  validator: >-
    {%- if zizmor_ignore is string or zizmor_ignore is mapping or zizmor_ignore is not iterable -%}
    zizmor_ignore must be a list of workflow paths.
    {%- else -%}
    {%- for p in zizmor_ignore if p is not string or not (p | regex_search('^\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$')) -%}
    Invalid zizmor_ignore entry '{{ p }}': expected .github/workflows/<name>.yml.{{ ' ' }}
    {%- endfor -%}
    {%- endif -%}

theme_bundle:
  type: bool
  help: Install the ocx-theme grim bundle (default on when the repo has a site)
  default: "{{ site is not none }}"
  when: "{{ profile == 'full' }}"
