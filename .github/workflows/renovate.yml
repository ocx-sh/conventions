# Self-hosted Renovate runner (D-03). Hosted Renovate cannot run `ocx lock`, so
# adopted repos are served from here: one scoped App token per owner, postUpgradeTasks, our copier.
name: renovate

on:
  schedule:
    - cron: "17 * * * 1-5" # hourly on weekdays; the preset's own schedule gates PR creation
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.fleet.outputs.matrix }}
      has-repos: ${{ steps.fleet.outputs.has-repos }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adopted repositories from fleet.toml, grouped by owner
        id: fleet
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, tomllib
          fleet = tomllib.load(open("fleet.toml", "rb"))["repos"]
          by_owner = {}
          for v in fleet.values():
              if v.get("adopted") and not v.get("excluded"):
                  owner, name = v["repo"].split("/", 1)
                  by_owner.setdefault(owner, []).append(name)
          include = [{"owner": o, "repos": json.dumps(sorted(f"{o}/{n}" for n in ns)), "names": "\n".join(sorted(ns))}
                     for o, ns in sorted(by_owner.items())]
          print("matrix=" + json.dumps({"include": include}))
          print("has-repos=" + ("true" if include else "false"))
          PY
          if ! grep -q '^has-repos=true' "$GITHUB_OUTPUT"; then
            echo "::notice::no repo in fleet.toml has adopted = true; nothing to renovate"
          fi

  renovate:
    needs: plan
    if: needs.plan.outputs.has-repos == 'true'
    name: renovate (${{ matrix.owner }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # RENOVATE_APP_ID / RENOVATE_APP_KEY live in this environment (deployment branches: main only), not as repo secrets.
    environment: renovate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Skip without Renovate App credentials
        id: gate
        env:
          RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          RENOVATE_APP_KEY: ${{ secrets.RENOVATE_APP_KEY }}
        run: |
          if [ -z "$RENOVATE_APP_ID" ] || [ -z "$RENOVATE_APP_KEY" ]; then
            echo "::notice::RENOVATE_APP_ID / RENOVATE_APP_KEY not set; skipping the Renovate run"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ocx (ocx, uv for copier, node for Renovate)
        if: steps.gate.outputs.enabled == 'true'
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: 0.6.5
          groups: default,lint,docs,build

      - name: Install copier (Renovate's copier manager runs it from PATH)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          version=$(sed -n 's/^ *COPIER_VERSION: "\([^"]*\)".*/\1/p' taskfiles/baseline.taskfile.yml)
          uv tool install "copier==${version:?COPIER_VERSION not found in taskfiles/baseline.taskfile.yml}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create Renovate App token
        id: token
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.names }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
          permission-metadata: read

      - name: Run Renovate
        if: steps.gate.outputs.enabled == 'true'
        env:
          RENOVATE_TOKEN: ${{ steps.token.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ matrix.repos }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # postUpgradeTasks only; the copier manager execs `copier update` directly and is not gated by this list.
          RENOVATE_ALLOWED_COMMANDS: '["^ocx lock$", "^bazel mod deps$"]'
          LOG_LEVEL: info
        run: npx --yes renovate@44.151.0
