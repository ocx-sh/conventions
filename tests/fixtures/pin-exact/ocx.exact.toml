# Exact-pin ocx.toml (the post pin-exact shape); also the C-015 regex-manager fixture.
[tools]
task = "ocx.sh/go-task/task:3.53.1"

[group.lint.tools]
prek = "ocx.sh/prek/prek:0.5.5"
gitleaks = "ocx.sh/gitleaks/gitleaks:8.30.1"
grim = "ocx.sh/grimoire/cli:0.14.3"
# a build-timestamped tag must never be picked up by Renovate
shellcheck = "ocx.sh/shellcheck/shellcheck:0.11.0_20260819"

[group.release.tools]
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.2"
