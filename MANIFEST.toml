# Ownership contract: one [[file]] per rendered destination path. Tests and `baseline:check` read this file.
# path = rendered path; source = path under template/ ({% if %} in a name skips the file when empty); class = template-owned | seeded-once;
# profiles = which of full|mirror render it; when (optional) = bazel | site | site.deploy (all imply profile full; answers "bazel", "site" non-null, "site.deploy" true).

[removed_by_adoption]
paths = [".github/dependabot.yml", "Taskfile.yml"]

# --- template-owned: rendered on every update; hand edits fail baseline:check ---

[[file]]
path = ".copier-answers.yml"
source = "{{ _copier_conf.answers_file }}.jinja"
class = "template-owned"
profiles = ["full", "mirror"]

[[file]]
path = "taskfiles/baseline.taskfile.yml"
source = "taskfiles/baseline.taskfile.yml"
class = "template-owned"
profiles = ["full", "mirror"]

[[file]]
path = ".pre-commit-config.yaml"
source = ".pre-commit-config.yaml"
class = "template-owned"
profiles = ["full", "mirror"]

[[file]]
path = "cliff.toml"
source = "cliff.toml.jinja"
class = "template-owned"
profiles = ["full", "mirror"]

[[file]]
path = "renovate.json"
source = "renovate.json.jinja"
class = "template-owned"
profiles = ["full", "mirror"]

[[file]]
path = "CLAUDE.md"
source = "CLAUDE.md"
class = "template-owned"
profiles = ["full", "mirror"]

[[file]]
path = ".github/workflows/verify-basic.yml"
source = ".github/workflows/verify-basic.yml.jinja"
class = "template-owned"
profiles = ["full", "mirror"]

[[file]]
path = ".github/zizmor.yml"
source = ".github/zizmor.yml"
class = "template-owned"
profiles = ["full", "mirror"]

[[file]]
path = ".github/workflows/verify-deep.yml"
source = ".github/workflows/{% if profile == 'full' %}verify-deep.yml{% endif %}.jinja"
class = "template-owned"
profiles = ["full"]

[[file]]
path = ".github/workflows/claude.yml"
source = ".github/workflows/{% if profile == 'full' %}claude.yml{% endif %}.jinja"
class = "template-owned"
profiles = ["full"]

[[file]]
path = ".github/workflows/deploy-site.yml"
source = ".github/workflows/{% if profile == 'full' and site and site.deploy %}deploy-site.yml{% endif %}.jinja"
class = "template-owned"
profiles = ["full"]
when = "site.deploy"

[[file]]
path = "bazel/baseline.bazelrc"
source = "{% if profile == 'full' and bazel %}bazel{% endif %}/baseline.bazelrc"
class = "template-owned"
profiles = ["full"]
when = "bazel"

# --- seeded-once (_skip_if_exists): written on first copy, repo-owned afterwards ---

[[file]]
path = "taskfile.yml"
source = "taskfile.yml.jinja"
class = "seeded-once"
profiles = ["full", "mirror"]

[[file]]
path = "ocx.toml"
source = "ocx.toml.jinja"
class = "seeded-once"
profiles = ["full", "mirror"]

[[file]]
path = "grimoire.toml"
source = "grimoire.toml.jinja"
class = "seeded-once"
profiles = ["full", "mirror"]

[[file]]
path = "AGENTS.md"
source = "AGENTS.md.jinja"
class = "seeded-once"
profiles = ["full", "mirror"]

[[file]]
path = ".gitleaks.toml"
source = ".gitleaks.toml"
class = "seeded-once"
profiles = ["full", "mirror"]

[[file]]
path = ".bazelrc"
source = "{% if profile == 'full' and bazel %}.bazelrc{% endif %}"
class = "seeded-once"
profiles = ["full"]
when = "bazel"

[[file]]
path = "MODULE.bazel"
source = "{% if profile == 'full' and bazel %}MODULE.bazel{% endif %}.jinja"
class = "seeded-once"
profiles = ["full"]
when = "bazel"
