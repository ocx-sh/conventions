# fleet.toml — every repo the OCX baseline tracks. Read by scripts/adopt.sh, drift/check.py and the Renovate runner.
schema = 1

# ---- iteration 1: canary ----

[repos.conventions]
repo = "ocx-sh/conventions"
path = "ocx-conventions"          # local checkout dir name under the fleet root
iteration = 1                      # 1 canary, 2 fleet, 3 mirrors
adopted = true
excluded = false

[repos.conventions.answers]
repo_name = "conventions"
profile = "full"
bazel = false
languages = ["python", "shell"]
deep_os = ["ubuntu-latest"]
theme_bundle = false
# site omitted = no site

[repos.rules_ocx]
repo = "ocx-sh/rules_ocx"
path = "rules_ocx"
iteration = 1
adopted = false
excluded = false

[repos.rules_ocx.answers]
repo_name = "rules_ocx"
profile = "full"
bazel = true
site = { dir = "site", dist = "site/dist", deploy = true, path = "/integrations/bazel", paths = ["docs/**"] }  # deploy.yml passes no path; Astro base /integrations/bazel/
languages = ["bazel", "shell", "typescript"]
deep_os = ["ubuntu-latest", "macos-latest", "windows-latest"]
theme_bundle = true

[repos.ocx-sdk-python]
repo = "ocx-sh/ocx-sdk-python"
path = "ocx-sdk-python"
iteration = 1
adopted = false
excluded = false

[repos.ocx-sdk-python.answers]
repo_name = "ocx-sdk-python"
profile = "full"
bazel = false
site = { dir = "site", dist = "site/dist", deploy = true, path = "/integrations/python" }  # Astro base /integrations/python/
languages = ["python", "typescript"]
deep_os = ["ubuntu-latest", "macos-latest", "windows-latest"]
theme_bundle = true

[repos.ocx-website]
repo = "ocx-sh/website"
path = "ocx-website"
iteration = 1
adopted = true
excluded = false

[repos.ocx-website.answers]
repo_name = "website"
profile = "full"
bazel = false
site = { dir = "site", dist = "site/dist", deploy = false, path = "" }  # root site; site.yml gates Bunny deploy on BUNNY_DEPLOY=true, kept false per plan
languages = ["typescript"]
deep_os = ["ubuntu-latest"]
theme_bundle = false

# ---- iteration 2: fleet (answers from iteration-tables.md; theme_bundle false, deep_os best-effort from runs-on grep, verify in iteration 2) ----

