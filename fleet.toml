[repos.ocx]
repo = "ocx-sh/ocx"
path = "ocx"
iteration = 2
adopted = true
excluded = false

[repos.ocx.answers]
repo_name = "ocx"
profile = "full"
bazel = true
site = { dir = "website", dist = "website/dist", deploy = false, path = "" }  # deploy off: deploy-docs.yml needs Rust and Bazel, so it stays repo-owned
languages = ["rust", "bazel", "python", "shell", "typescript"]
deep_os = ["ubuntu-latest"]  # the native macOS and Windows legs live in the repo-owned deep-repo.yml
theme_bundle = false
repo_workflows = { secrets = ["BAZEL_CACHE_WRITE_AUTH"] }
submodules = true
bazel_cache_write = "trusted"
zizmor_ignore = [".github/workflows/release.yml"]  # cargo-dist generates and drift-checks it

